# محتوى غرفة الهروب الرعب — بيت قديم ليلاً
# 10 غرف، كل غرفة عليها باب مقفول بقفل رقمي (كيباد)
# الصعوبة (tier) بتزيد كل غرفة — راجع تعليق "منطق اللغز" في كل غرفة عشان تفهم الحل، النص ده مش بيتعرض للاعب

intro: >
  تفتح عينيك على أرضية خشبية باردة. آخر حاجة فاكرها إنك دخلت البيت القديم
  ده عشان تهرب من المطر. الباب اللي وراك اتقفل لوحده. قدامك 10 أبواب،
  كل باب عليه قفل رقمي بيلمع في الضلمة. لازم تدوّر، تلاقي الرقم، وتخرج
  قبل ما... حاجة تانية توصلك الأول.

ending_win: >
  الباب الأخير بيفتح على صوت صرير طويل. هواء الليل البارد بيضربك في وشك.
  ورا ضهرك، البيت بيرجع ساكت — كأنه كان مستني حد غيرك.

ending_lose: >
  الأبواب بتتقفل كلها في نفس اللحظة. النور بيروح. آخر حاجة سمعتها هي
  خطوات بطيئة بتقرب من ورا الحيط.

rooms:
  - id: 1
    name: "غرفة النوم"
    tier: 1
    difficulty_note: "الكود مكتوب صريح على غرض واحد، من غير أي تمويه."
    intro: >
      سرير قديم بغطاء ممزق، خزانة جانبية مايلة، ومرآة معلقة مايلة شوية عن
      وضعها الطبيعي. لوحة زيتية باهتة معلقة فوق السرير لراجل مش عارف
      يبص لك ولا لأ.
    objects:
      - name: "السرير"
        examine: "الغطاء بارد وثقيل. مفيش حاجة تحته غير غبار."
      - name: "الخزانة الجانبية"
        examine: >
          الدرج مقفول بصعوبة... بيتفتح فجأة وجواه كشاف يدوي شغال.
          بتاخده معاك.
        gives_item: "كشاف"
      - name: "المرآة"
        examine: "بتشوف نفسك... وبس. ولا حد وراك. تقريبًا."
      - name: "اللوحة الزيتية"
        examine: >
          وراها ورقة مطوية اتلزقت بشمع قديم. مكتوب عليها بخط يد مرتجف:
          "1974".
        is_clue: true
    code: "1974"
    red_herrings: []
    hints:
      - "فيه حاجة ملزوقة ورا اللوحة."
      - "اتفحص كل غرض، الرقم مكتوب صريح على ورقة."
    max_attempts: null
    tension_on_fail: "الباب بيهز بصوت خفيف. مفيش حاجة تانية."

  - id: 2
    name: "الحمام"
    tier: 2
    difficulty_note: >
      فخ واحد بسيط: تاريخ الصلاحية على عبوة الدواء بيشبه كود لكنه مش هو.
      الكود الحقيقي هو "رقم الوصفة" على نفس العبوة.
    intro: >
      مرآة الحمام مكسورة في نص شكل غريب، كأن حد ضربها من جوه. صوت نقطة
      ميه بتقطر من الدش من غير أي سبب واضح.
    objects:
      - name: "خزانة الأدوية"
        examine: >
          عبوة دوا قديمة عليها ملصق: "تاريخ الصلاحية: 06/03" و"رقم
          الوصفة: 2603".
        is_clue: true
      - name: "المرآة المكسورة"
        examine: "في الكسر، بتشوف حتة من وش مش وشك."
      - name: "الدولاب"
        examine: "فاضي غير من فوطة متسخة."
      - name: "ستارة الدش"
        examine: "بتسحبها بسرعة... مفيش حد وراها. النفس اللي مسكته اتخرج."
    code: "2603"
    red_herrings:
      - source: "عبوة الدواء"
        text: "تاريخ الصلاحية 0603 — شكله كود بس هو مش الرقم المطلوب."
    hints:
      - "العبوة عليها رقمين، مش كل رقم فيها هو الكود."
      - "دوّر على كلمة \"رقم الوصفة\"."
    max_attempts: null
    tension_on_fail: "لمبة الحمام بترمش مرتين وترجع تشتغل."

  - id: 3
    name: "المكتب"
    tier: 3
    difficulty_note: >
      الكود اتقسم على غرضين: أول رقمين من رسالة محروقة، آخر رقمين من
      وقت الساعة المتوقفة. لازم تجمعهم.
    intro: >
      مكتب خشبي تقيل مليان أوراق قديمة. ساعة حائط واقفة من زمان. ريحة
      ورق محروق لسه فايحة في الأوضة.
    objects:
      - name: "المكتب"
        examine: >
          رسالة نص محروق. اللي باقي منها بيقول: "الكود يبدأ بـ 41" —
          الباقي رماد.
        is_clue: true
      - name: "خزانة الكتب"
        examine: >
          كتاب عنوانه "غرفة رقم 68" حط بشكل غريب على حرف الرف، كأن حد
          حطه هناك عمدًا.
      - name: "الساعة المتوقفة"
        examine: "عقارب الساعة واقفة عند 4:17 بالظبط."
        is_clue: true
    code: "4117"
    red_herrings:
      - source: "كتاب على الرف"
        text: "رقم الغرفة 68 على الكتاب مالوش علاقة بالكود."
    hints:
      - "الرسالة المحروقة فيها أول نص الكود بس."
      - "كمّل الرقم من وقت الساعة المتوقفة."
    max_attempts: null
    tension_on_fail: "الساعة المتوقفة بتدق دقة واحدة... وترجع تسكت."

  - id: 4
    name: "غرفة الأطفال"
    tier: 4
    difficulty_note: >
      لازم تتفاعل مع الغرض (تفتح صندوق الألعاب/تلف علبة الموسيقى) عشان
      يطلع الكود. فخ واضح ومغري: رقم مكتوب بالطباشير على الحيط.
    intro: >
      لعب أطفال مرمية على الأرض. سرير صغير فاضي وبطانيته لسه مطوية.
      على الحيط، أرقام مكتوبة بالطباشير بخط يد طفل.
    objects:
      - name: "صندوق الألعاب"
        examine: >
          مقفول بمزلاج بسيط. لما بتفتحه بتلاقي علبة موسيقى قديمة.
      - name: "علبة الموسيقى"
        examine: >
          بتلفها... لحن حزين بيتشغل، وبعد شوية بتتفتح وتطلع ورقة صغيرة
          مطوية جواها: "5382".
        is_clue: true
      - name: "الحيط المكتوب عليه بالطباشير"
        examine: "أرقام كبيرة: \"1234\". مكتوبة بخط طفل فرحان بلعبته."
      - name: "السرير الصغير"
        examine: "البطانية لسه دافية. غريب."
    code: "5382"
    red_herrings:
      - source: "كتابة الطباشير على الحيط"
        text: "الرقم 1234 مجرد لعب طفل، مش كود."
    hints:
      - "الصندوق مش مقفول خالص، جرب تفتحه."
      - "الكود جوه حاجة بتتلف، مش على الحيط."
    max_attempts: null
    tension_on_fail: "لحن علبة الموسيقى بيشتغل لوحده لحظة، وبعدين بيسكت."

  - id: 5
    name: "المطبخ"
    tier: 5
    difficulty_note: >
      شفرة بسيطة: الرقم مكتوب معكوس (زي المرآة) على بخار الزجاج. لازم
      اللاعب "يعكس" الرقم اللي شايفه. فخ: تاريخ على تقويم الحيط.
    intro: >
      ريحة أكل باظت من زمان. تقويم على الحيط لسه واقف على تاريخ قديم.
      باب الثلاجة نص مفتوح وضلمة جواها.
    objects:
      - name: "باب الثلاجة"
        examine: >
          البخار المتجمد على الزجاج مكتوب عليه أرقام بإصبع حد — لكن
          مكتوبة بالمقلوب، كأنها اتكتبت من جوه الثلاجة: "3891".
        is_clue: true
      - name: "تقويم الحيط"
        examine: "واقف على تاريخ \"05/12\". حد نسي يقلّبه من زمان."
      - name: "درج السكاكين"
        examine: "فاضي. مكان كل سكينة لسه باين في القماش."
      - name: "الطاولة"
        examine: "كوباية شاي باردة، لسه فيها بخار خفيف غريب."
    code: "1983"
    red_herrings:
      - source: "تقويم الحيط"
        text: "التاريخ 0512 مش كود، مجرد تاريخ قديم."
    hints:
      - "الرقم على باب الثلاجة مكتوب بالعكس."
      - "لو عكست 3891 هتوصل للكود."
    max_attempts: null
    tension_on_fail: "صوت خبط خفيف بيجي من جوه الثلاجة."

  - id: 6
    name: "غرفة الطعام"
    tier: 6
    difficulty_note: >
      محتاج غرض من غرفة سابقة (الكشاف من غرفة 1) عشان تشوف الأرقام
      المحفورة في الزاوية المظلمة. فخ: تاريخ تحت اللوحة العائلية.
    intro: >
      طاولة طعام طويلة متجهزة لعشاء ما حصلش. لوحة عائلية كبيرة معلقة،
      وشوش الناس فيها متمسحة بعمد. زاوية من الأوضة غرقانة في ضلمة تامة.
    objects:
      - name: "اللوحة العائلية"
        examine: "تحتها مكتوب \"1958\" — سنة رسم اللوحة."
      - name: "خزانة الصيني"
        examine: "أطباق مرصوصة بعناية، متغبرة من سنين."
      - name: "الزاوية المظلمة"
        examine: >
          محتاج ضوء عشان تشوف فيها حاجة.
        requires_item: "كشاف"
        examine_with_item: >
          بضوء الكشاف، بتبان أرقام محفورة في الحيط بظفر أو مسمار:
          "7245".
        is_clue: true
    code: "7245"
    red_herrings:
      - source: "أسفل اللوحة العائلية"
        text: "السنة 1958 مالهاش علاقة بالكود."
    hints:
      - "الزاوية دي محتاجة ضوء، ولازم يكون معاك حاجة بتنور."
      - "دوّر على الكشاف اللي لقيته في أول غرفة."
    max_attempts: null
    tension_on_fail: "الكراسي حوالين الطاولة بتتحرك سنتيمتر... وحده بس."

  - id: 7
    name: "المكتبة"
    tier: 7
    difficulty_note: >
      شفرة أرقام رومانية — اللاعب لازم يحوّلها لرقم عادي. فخ: رقم صفحة
      عادي على كتاب تاني.
    intro: >
      رفوف كتب توصل للسقف. كرسي هزاز بيتحرك لوحده ببطء. كتاب قديم فاتح
      على منضدة صغيرة في نص الأوضة.
    objects:
      - name: "الكتاب المفتوح"
        examine: >
          منقوش بالحبر على الصفحة: "MCMLXVI" — تاريخ بالأرقام الرومانية.
        is_clue: true
      - name: "الرفوف"
        examine: >
          كتاب عليه رقم صفحة عادي مكتوب بقلم رصاص: "245".
      - name: "الكرسي الهزاز"
        examine: "لسه بيتحرك. مفيش حد قاعد عليه."
    code: "1966"
    red_herrings:
      - source: "رقم صفحة على كتاب في الرف"
        text: "الرقم 245 مجرد رقم صفحة، مش كود."
    hints:
      - "MCMLXVI رقم روماني — حوّله لأرقام عادية."
      - "الرقم الروماني ده يساوي سنة."
    max_attempts: null
    tension_on_fail: "صفحات الكتاب المفتوح بتتقلب لوحدها صفحة واحدة."

  - id: 8
    name: "القبو"
    tier: 8
    difficulty_note: >
      ضلمة تامة — لازم الكشاف عشان تقرا أي حاجة في الأوضة دي خالص. فخ
      قوي: رقم محفور بالأظافر يشبه استغاثة مش كود.
    intro: >
      درج بيهبط لضلمة كاملة. مفيش نور خالص هنا. برد غريب بينزل مع كل
      خطوة.
    objects:
      - name: "الحيط الحجري"
        examine: "من غير ضوء، مش قادر تشوف حاجة."
        requires_item: "كشاف"
        examine_with_item: >
          بالكشاف، بتبان أرقام باهتة اتكتبت بقلم رصاص من زمان:
          "6053".
        is_clue: true
      - name: "الحيط المقابل"
        examine: >
          محفور فيه بالأظافر أرقام عميقة: "9999" — كأن حد كان بييأس.
        requires_item: "كشاف"
      - name: "الصناديق القديمة"
        examine: "صناديق فاضية، بعضها اتكسر من الرطوبة."
    code: "6053"
    red_herrings:
      - source: "أرقام محفورة بالأظافر"
        text: "9999 علامة يأس من حد قبلك، مش كود."
    hints:
      - "من غير الكشاف مش هتقدر تقرا حاجة هنا خالص."
      - "الأرقام الباهتة على الحيط الأول هي الكود، مش المحفورة بالأظافر."
    max_attempts: null
    tension_on_fail: "الكشاف بيرمش لحظة. صوت تنفّس بعيد بيوصلك."

  - id: 9
    name: "الغرفة الطقسية"
    tier: 9
    difficulty_note: >
      لغز ترتيب: أربع شمعات مرقّمة لازم تترتب من الأطول للأقصر عشان
      يطلع الكود. فخان قويان: نجمة خماسية وأرقام رومانية زخرفية بس.
      محاولة غلط هنا بتسبب توتر عالي.
    intro: >
      دايرة مرسومة بالطباشير على الأرض، حواليها أربع شمعات ولافتة
      عليها كتابة باهتة: "رتّبهم من الأطول للأقصر، والأرقام هتقودك."
    objects:
      - name: "الشمعة أ"
        examine: "أطول شمعة في الدايرة. عليها رقم منقوش: 7."
        is_clue: true
      - name: "الشمعة ب"
        examine: "أقصر شمعة، دابت تقريبًا خالص. عليها رقم: 2."
        is_clue: true
      - name: "الشمعة ج"
        examine: "طولها متوسط، أطول من نص الدايرة. عليها رقم: 4."
        is_clue: true
      - name: "الشمعة د"
        examine: "طولها متوسط، أقصر من الشمعة ج بشوية. عليها رقم: 9."
        is_clue: true
      - name: "النجمة الخماسية على الحيط"
        examine: "على كل رأس فيها رقم مختلف. زخرفة قديمة، ولا تعني حاجة."
      - name: "الأرقام الرومانية حوالين الدايرة"
        examine: "منقوشة كزخرفة حوالين الدايرة، مالهاش قيمة عملية."
    code: "7492"
    red_herrings:
      - source: "النجمة الخماسية"
        text: "أرقامها فخ بصري، مالهاش علاقة بالكود."
      - source: "الأرقام الرومانية الزخرفية"
        text: "زخرفة بس، مش جزء من اللغز."
    hints:
      - "رتّب الشمعات حسب طولها: من الأطول للأقصر."
      - "الترتيب: أ، ج، د، ب."
    max_attempts: null
    tension_on_fail: >
      صوت خطوات بطيئة بيبدأ يقرب من بره الباب. مش هيوصل... لسه.

  - id: 10
    name: "الباب الأخير"
    tier: 10
    difficulty_note: >
      كود ختامي: تجميع آخر رقم من كود كل غرفة زوجية سابقة (2، 4، 6، 8)
      بالترتيب. اللاعب لازم يكون فاكر أو مسجل الأكواد اللي فاتت.
      3 محاولات بس — أعلى مخاطرة في اللعبة.
    intro: >
      لوحة معدنية باردة عليها 4 خانات فاضية. ورقة مرمية جنبها مكتوب
      عليها: "آخر رقم من كل باب زوجي عدّيت منه... هو طريقك برّه."
      رقم منقوش على الباب نفسه بخط كبير: "0000".
    objects:
      - name: "الورقة الملقاة"
        examine: >
          "آخر رقم من كود غرفة 2، وغرفة 4، وغرفة 6، وغرفة 8، بالترتيب
          ده بالظبط — هو الكود اللي هيفتح الباب."
        is_clue: true
      - name: "الرقم المنقوش على الباب"
        examine: "0000 — منقوش بعمق، كأنه إعادة ضبط. مش هو الكود."
      - name: "اللوحة المعدنية"
        examine: "4 خانات فاضية، بتلمع كل ما تقرب منها."
    code: "3253"
    code_derivation_note: >
      آخر رقم من: غرفة2=2603→3، غرفة4=5382→2، غرفة6=7245→5،
      غرفة8=6053→3. الناتج: 3253.
    red_herrings:
      - source: "الرقم المنقوش على الباب"
        text: "0000 فخ واضح، بيوهم إنه إعادة ضبط."
    hints:
      - "لازم تكون فاكر (أو مسجل) أكواد الغرف الزوجية اللي فاتت."
      - "الترتيب مهم: غرفة 2، بعدين 4، بعدين 6، بعدين 8."
    max_attempts: 3
    tension_on_fail: "لمبة اللوحة بتوحش لون احمر. محاولة ضاعت."
    tension_on_final_fail: >
      لو خلصت الـ3 محاولات من غير ما تفتح — النهاية بتبقى ending_lose.
